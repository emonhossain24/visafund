name: Banking Feed checks

on:
  push:
    branches: [cloudflare-preparation]
  pull_request:
    branches: [cloudflare-preparation]
  workflow_dispatch:

# Keep only the newest validation run for this branch/PR.
concurrency:
  group: banking-feed-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:community
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec eslint app/banking-feed.tsx app/community-admin.tsx app/admin-site.tsx app/api/community/route.ts app/api/community-admin/route.ts lib/community-admin-service.ts lib/community-cleanup.ts build/cloudflare-worker.ts tests-community.ts tests-auth.ts
      - run: pnpm build:cloudflare
