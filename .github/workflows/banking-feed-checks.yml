name: Banking Feed checks

on:
  push:
    branches: [cloudflare-preparation]
  pull_request:
    branches: [cloudflare-preparation]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:community
      - run: pnpm exec tsc --noEmit
      - run: pnpm lint
      - run: pnpm build:cloudflare
